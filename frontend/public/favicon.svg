<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">
  <title>In-Stock Favicon</title>
  <desc>Minimal network node icon for In-Stock</desc>

  <!-- Background -->
  <rect x="12" y="12" width="488" height="488" rx="112"
        fill="#294628"/>

  <!-- Network connections -->
  <g stroke="#F5F7F3" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="278" x2="164" y2="190"/>
    <line x1="256" y1="278" x2="350" y2="150"/>
    <line x1="256" y1="278" x2="132" y2="342"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#9DBB9A">
    <circle cx="164" cy="190" r="31"/>
    <circle cx="350" cy="150" r="31"/>
    <circle cx="132" cy="342" r="31"/>
  </g>

  <!-- Central node -->
  <circle cx="256" cy="278" r="38" fill="#F5F7F3"/>
</svg>
